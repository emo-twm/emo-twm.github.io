<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-MO 倚盟電訊 - 贈品後台管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:#f5f5f3;min-height:100vh}
.login-wrap{max-width:380px;margin:5rem auto;padding:1.5rem}
.login-card{background:#fff;border-radius:16px;padding:2rem;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.login-logo{text-align:center;margin-bottom:1.5rem}
.logo-circle{width:52px;height:52px;border-radius:50%;background:#2c2c2a;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;margin-bottom:.5rem}
.login-title{font-size:18px;font-weight:700;color:#2c2c2a}
.login-sub{font-size:13px;color:#999;margin-top:4px}
.form-group{margin-bottom:1rem}
.form-label{font-size:13px;color:#666;margin-bottom:6px;display:block;font-weight:500}
.form-input{width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:10px;font-size:15px;background:#fff;color:#2c2c2a;outline:none;transition:border-color .15s}
.form-input:focus{border-color:#2c2c2a}
.btn{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#2c2c2a;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:hover{background:#f5f5f3}
.btn-primary{background:#2c2c2a;border-color:#2c2c2a;color:#fff}
.btn-primary:hover{background:#444}
.btn-sm{width:auto;padding:6px 14px;font-size:13px;border-radius:8px;margin-top:0}
.btn-danger{background:#fff5f5;border-color:#fca5a5;color:#dc2626}
.btn-danger:hover{background:#fee2e2}
.btn-success{background:#f0fdf4;border-color:#86efac;color:#16a34a}
.err{color:#dc2626;font-size:13px;margin-top:.5rem;text-align:center}
.navbar{background:#2c2c2a;padding:0 1.5rem;display:flex;align-items:center;height:52px;gap:4px;overflow-x:auto}
.navbar-brand{color:#fff;font-weight:700;font-size:15px;margin-right:1rem;white-space:nowrap}
.nav-tab{padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;background:none;border:none;color:rgba(255,255,255,.6);transition:all .15s;white-space:nowrap}
.nav-tab:hover{color:#fff;background:rgba(255,255,255,.1)}
.nav-tab.active{color:#fff;background:rgba(255,255,255,.15);font-weight:600}
.nav-logout{margin-left:auto;color:rgba(255,255,255,.5);font-size:13px;cursor:pointer;background:none;border:none;padding:6px 10px}
.nav-logout:hover{color:#fff}
.content{padding:1.5rem;max-width:1100px;margin:0 auto}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:1.5rem}
.stat-card{background:#fff;border-radius:12px;padding:1.25rem;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat-label{font-size:12px;color:#999;margin-bottom:4px;font-weight:500}
.stat-value{font-size:26px;font-weight:700;color:#2c2c2a}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.section-title{font-size:16px;font-weight:700;color:#2c2c2a}
.table-wrap{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
th{text-align:left;padding:10px 14px;font-weight:600;color:#999;border-bottom:1px solid #f0f0ee;font-size:12px;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #f8f8f6;color:#2c2c2a;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}
.store-badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:#f0f0ee;color:#666;font-weight:500}
.zchip{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid #ddd;background:#fff;color:#aaa;font-weight:600;cursor:pointer;user-select:none;margin:2px 2px 2px 0;white-space:nowrap}
.zchip.on.renew{background:#B5D4F4;border-color:#B5D4F4;color:#0C447C}
.zchip.on.points{background:#C0DD97;border-color:#C0DD97;color:#27500A}
.zchip.on.iphone18{background:#1c1c1a;border-color:#1c1c1a;color:#f5d67a}
.zchip.static{cursor:default}
.zchip-hint{font-size:11px;color:#999;margin:-4px 0 8px}
.badge-pts{background:#dcfce7;color:#16a34a;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.badge-val{background:#fee2e2;color:#dc2626;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.badge-pre{background:#1c1c1a;color:#f5d67a;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.filter-bar{display:flex;gap:8px;margin-bottom:.75rem;flex-wrap:wrap}
.filter-select{padding:7px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;background:#fff;color:#2c2c2a;outline:none}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal{background:#fff;border-radius:16px;padding:1.5rem;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:1rem;color:#2c2c2a}
.modal-footer{display:flex;gap:8px;margin-top:1.25rem;justify-content:flex-end}
.stock-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel{background:#fff;border-radius:12px;padding:1.25rem;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:1.25rem}
.panel-title{font-size:15px;font-weight:700;color:#2c2c2a;margin-bottom:.75rem}
.hq-th{background:#2c2c2a;color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600}
.hq-td{background:#f3f2ee;font-weight:700}
.dist-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dist-cell{border-radius:10px;padding:10px 12px}
.dist-cell .form-input{margin-top:6px;background:#fff}
.dist-now{font-size:12px;opacity:.85}
.dist-sum{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:1rem;font-size:14px;color:#2c2c2a}
.dist-sum b{font-size:18px}
.warn{color:#dc2626;font-weight:700}
.alert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.alert-box{border:1px solid #eee;border-radius:10px;padding:12px;max-height:280px;overflow-y:auto}
.alert-box-title{font-size:13px;font-weight:700;margin-bottom:8px}
.alert-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #eee;font-size:13px}
.alert-item:last-child{border-bottom:none}
.alert-empty{font-size:13px;color:#bbb;padding:6px 0}
.mini-badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;font-weight:600;margin:1px 2px 1px 0}
.count-input{width:90px;padding:7px 10px;border:1px solid #ddd;border-radius:8px;font-size:15px;text-align:right}
.count-input.filled{border-color:#2c2c2a;background:#fffbea}
.diff-pos{color:#16a34a;font-weight:600}
.diff-neg{color:#dc2626;font-weight:600}
.row-cancel td{color:#bbb;text-decoration:line-through}
.row-cancel td:last-child{text-decoration:none}
.hint{font-size:12px;color:#999;line-height:1.6}
textarea.form-input{font-size:13px;min-height:120px;font-family:inherit}
.sig-img{width:100px;height:45px;border:1px solid #eee;border-radius:6px;object-fit:contain}
.change-pos{color:#16a34a;font-weight:600}
.change-neg{color:#dc2626;font-weight:600}
.loading{text-align:center;padding:3rem;color:#999;font-size:14px}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid #eee;border-top-color:#2c2c2a;border-radius:50%;animation:spin .7s linear infinite;margin-bottom:.75rem}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-row td{text-align:center;color:#bbb;padding:2.5rem!important}
.store-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:1.5rem}
.store-sum-card{border-radius:12px;padding:1.25rem}
</style>
</head>

<script type="module">

const IMG_BASE = 'https://emo-twm.github.io/';
function imgUrl(val) {
  if(!val) return '';
  if(val.startsWith('http')) return val;
  return IMG_BASE + encodeURIComponent(val);
}

const STORES = ['鼎山','陽明','後昌','仁雄','凱旋'];
const STORE_COLORS = {
  '鼎山':{bg:'#B5D4F4',text:'#0C447C'},
  '陽明':{bg:'#C0DD97',text:'#27500A'},
  '後昌':{bg:'#FAC775',text:'#633806'},
  '仁雄':{bg:'#CECBF6',text:'#3C3489'},
  '凱旋':{bg:'#F4C0D1',text:'#72243E'},
};

// ===== 總部庫存 =====
const HQ = '總部';
const ALL_LOCS = [HQ, ...STORES];
const LOC_COLORS = {...STORE_COLORS, [HQ]:{bg:'#2c2c2a',text:'#ffffff'}};
const ALERT_STORE_DEFAULT = 2;   // 門市剩這個數量以下 → 提醒配發
const ALERT_HQ_DEFAULT = 5;      // 總部剩這個數量以下 → 提醒進貨
function sv(g,loc){ return (g && g.stock && g.stock[loc]) || 0; }
function hasHq(g){ return !!(g && g.stock && typeof g.stock[HQ]==='number'); }
function storeSum(g){ return STORES.reduce((a,s)=>a+sv(g,s),0); }
function alertStoreOf(g){ return Number.isFinite(g.alertStore)?g.alertStore:ALERT_STORE_DEFAULT; }
function alertHqOf(g){ return Number.isFinite(g.alertHq)?g.alertHq:ALERT_HQ_DEFAULT; }
function localDate(){ return new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'}); }
function opName(){ return state.currentUser?.name||'管理員'; }
function esc(t){ return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function locBadge(loc){
  const c=LOC_COLORS[loc];
  return c?`<span class="store-badge" style="background:${c.bg};color:${c.text}">${loc===HQ?HQ:loc+'店'}</span>`:esc(loc||'');
}
function giftLabel(g){ return (inZone(g,ZONE_PRE)?'🍎 預購禮｜':'')+g.name; }
function sortedGifts(list){ return [...list].sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh-Hant')); }
function restockAlerts(){
  const toSend=[], toBuy=[];
  state.gifts.filter(g=>!g.noRestock).forEach(g=>{
    const hq=sv(g,HQ);
    const low=STORES.filter(s=>sv(g,s)<=alertStoreOf(g));
    if(hq>0 && low.length) toSend.push({g,low,hq});
    if(hasHq(g) && hq<=alertHqOf(g)) toBuy.push({g,hq});
  });
  toSend.sort((a,b)=>b.low.length-a.low.length);
  toBuy.sort((a,b)=>a.hq-b.hq);
  return {toSend,toBuy};
}
function errMsg(err){ return err && err.code ? '操作失敗，請重新整理後再試一次（錯誤代碼 '+err.code+'）' : (err?.message||'操作失敗'); }
const DRAFT_KEY='emo-hq-count-draft';
function loadDraft(){ try{ return JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}')||{}; }catch(e){ return {}; } }
function saveDraft(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(state.countDraft)); }catch(e){} }

const ZONE_PRE = 'iphone18';
const ZONE_PRE_LABEL = '🍎 預購禮';
const ZONES = [{id:'renew',label:'📱 申辦好禮'},{id:'points',label:'🪙 繳費集點'},{id:ZONE_PRE,label:ZONE_PRE_LABEL}];
function giftZones(g){
  if(Array.isArray(g.zones) && g.zones.length) return g.zones;
  if(g.zone===ZONE_PRE) return [ZONE_PRE];
  return []; // 尚未分類（前台會同時出現在續約與集點）
}
function isUntagged(g){ return !(Array.isArray(g.zones)&&g.zones.length) && g.zone!==ZONE_PRE; }
function inZone(g,z){ return giftZones(g).includes(z); }
function zoneLabel(z){ const f=ZONES.find(x=>x.id===z); return f?f.label:(z==='general'?'一般（舊紀錄）':z||''); }
function zoneChips(g,editable){
  return ZONES.map(z=>`<span class="zchip ${z.id} ${inZone(g,z.id)?'on':''} ${editable?'':'static'}" ${editable?`data-action="toggleZone" data-gid="${g.id}" data-zone="${z.id}"`:''}>${z.label}</span>`).join('')
    + (isUntagged(g)?`<span class="tag">未分類</span>`:'');
}
function zoneTag(z){ return z===ZONE_PRE?`<span class="badge-pre">🍎 預購禮</span>`:(z==='renew'||z==='points')?`<span class="tag">${zoneLabel(z)}</span>`:''; }

const DEFAULT_USERS = [
  {username:'00200',password:'00200',role:'admin',name:'許曉雯',store:'總部'},
  {username:'13506',password:'13506',role:'admin',name:'姚東妍',store:'總部'},
  {username:'24106',password:'24106',role:'admin',name:'廖宛如',store:'總部'},
  {username:'08807',password:'08807',role:'staff',name:'劉家妘',store:'鼎山'},
  {username:'20510',password:'20510',role:'staff',name:'黃子珊',store:'鼎山'},
  {username:'25506',password:'25506',role:'staff',name:'陳亭安',store:'鼎山'},
  {username:'24502',password:'24502',role:'staff',name:'涂彥州',store:'鼎山'},
  {username:'19109',password:'19109',role:'staff',name:'黃庭鈞',store:'陽明'},
  {username:'10508',password:'10508',role:'staff',name:'方若帆',store:'陽明'},
  {username:'16511',password:'16511',role:'staff',name:'劉芳廷',store:'陽明'},
  {username:'25406',password:'25406',role:'staff',name:'林瑞獻',store:'陽明'},
  {username:'22911',password:'22911',role:'staff',name:'郭家維',store:'後昌'},
  {username:'22811',password:'22811',role:'staff',name:'邱雨蔚',store:'後昌'},
  {username:'24602',password:'24602',role:'staff',name:'秦曼芯',store:'後昌'},
  {username:'17506',password:'17506',role:'staff',name:'黃傑稜',store:'仁雄'},
  {username:'21207',password:'21207',role:'staff',name:'黃閔聖',store:'仁雄'},
  {username:'24703',password:'24703',role:'staff',name:'郭紳鴻',store:'仁雄'},
  {username:'25306',password:'25306',role:'staff',name:'蔡冠廷',store:'仁雄'},
  {username:'21107',password:'21107',role:'staff',name:'陳宛姍',store:'凱旋'},
  {username:'23212',password:'23212',role:'staff',name:'高琦茗',store:'凱旋'},
  {username:'23412',password:'23412',role:'staff',name:'石佳穎',store:'凱旋'},
  {username:'25610',password:'25610',role:'staff',name:'林庭逸',store:'凱旋'},
  {username:'26004',password:'26004',role:'staff',name:'劉宗翰',store:'凱旋'},
];

let state = {
  loggedIn: false,
  currentUser: null,
  tab: 'dashboard',
  modal: null,
  editingGift: null,
  filterStore: '',
  filterDate: '',
  filterZone: '',
  giftFilterZone: '',
  giftPage: 1,
  gifts: [],
  orders: [],
  inventoryHistory: [],
  distributions: [],
  distError: '',
  dist: {gid:'', qty:{}, note:''},
  distFilterStore: '',
  distFilterDate: '',
  countDraft: loadDraft(),
  countZone: '',
  countPaste: false,
  users: [...DEFAULT_USERS],
  loading: true,
};

let loadCount = 0;
function checkLoaded() {
  loadCount++;
  if(loadCount >= 4) { state.loading = false; render(); }
  else render();
}
onSnapshot(collection(db, 'gifts'), snap => {
  state.gifts = snap.docs.map(d => ({id:d.id,...d.data()}));
  if(state.loading) checkLoaded(); else render();
});
onSnapshot(collection(db, 'orders'), snap => {
  state.orders = snap.docs.map(d => ({id:d.id,...d.data()})).sort((a,b)=>b.timestamp?.localeCompare(a.timestamp||'')||0);
  if(state.loading) checkLoaded(); else render();
});
onSnapshot(collection(db, 'inventoryHistory'), snap => {
  state.inventoryHistory = snap.docs.map(d => ({id:d.id,...d.data()})).sort((a,b)=>b.timestamp?.localeCompare(a.timestamp||'')||0);
  if(state.loading) checkLoaded(); else render();
});
onSnapshot(collection(db, 'distributions'), snap => {
  state.distributions = snap.docs.map(d => ({id:d.id,...d.data()})).sort((a,b)=>b.timestamp?.localeCompare(a.timestamp||'')||0);
  state.distError = '';
  if(state.loading) checkLoaded(); else render();
}, err => { state.distError = errMsg(err); if(state.loading) checkLoaded(); else render(); });
setTimeout(()=>{ if(state.loading){ state.loading=false; render(); } }, 5000);

function render() {
  const app = document.getElementById('app');
  if(state.loading) { app.innerHTML = '<div class="loading"><div class="spinner"></div><br>連線中...</div>'; return; }
  if(!state.loggedIn) { app.innerHTML = renderLogin(); attachEvents(); return; }
  const y = window.scrollY;
  app.innerHTML = renderAdmin();
  attachEvents();
  window.scrollTo(0, y);
}

function renderLogin() {
  return `<div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-circle">E-MO</div>
        <div class="login-title">倚盟電訊後台管理</div>
        <div class="login-sub">贈品兌換系統</div>
      </div>
      <div class="form-group"><label class="form-label">帳號</label><input class="form-input" id="lu" type="text" placeholder="請輸入帳號"></div>
      <div class="form-group"><label class="form-label">密碼</label><input class="form-input" id="lp" type="password" placeholder="請輸入密碼"></div>
      <button class="btn btn-primary" data-action="doLogin">登入</button>
      <div id="lerr" class="err"></div>
    </div>
  </div>`;
}

function renderAdmin() {
  const isAdmin = state.currentUser?.role === 'admin';
  const tabs = [
    {id:'dashboard',label:'總覽'},
    {id:'gifts',label:'贈品管理'},
    {id:'orders',label:'兌換紀錄'},
    {id:'inventory',label:'庫存紀錄'},
    ...(isAdmin?[{id:'distribute',label:'總部配發'},{id:'count',label:'總部盤點'}]:[]),
    {id:'stores',label:'門市管理'},
    ...(isAdmin?[{id:'users',label:'帳號管理'}]:[])
  ];
  return `<div>
    <div class="navbar">
      <span class="navbar-brand">E-MO 倚盟電訊</span>
      ${tabs.map(t=>`<button class="nav-tab${state.tab===t.id?' active':''}" data-action="tab" data-tab="${t.id}">${t.label}</button>`).join('')}
      <button class="nav-logout" data-action="logout">登出</button>
    </div>
    <div class="content">
      ${state.tab==='dashboard'?renderDashboard():''}
      ${state.tab==='gifts'?renderGifts():''}
      ${state.tab==='orders'?renderOrders():''}
      ${state.tab==='inventory'?renderInventory():''}
      ${state.tab==='distribute'&&isAdmin?renderDistribute():''}
      ${state.tab==='count'&&isAdmin?renderCount():''}
      ${state.tab==='stores'?renderStores():''}
      ${state.tab==='users'&&isAdmin?renderUsers():''}
    </div>
    ${state.modal?renderModal():''}
  </div>`;
}

function renderDashboard() {
  const today = new Date().toISOString().slice(0,10);
  const todayOrders = state.orders.filter(o=>o.date===today).length;
  const totalStock = state.gifts.reduce((a,g)=>a+storeSum(g),0);
  const hqStock = state.gifts.reduce((a,g)=>a+sv(g,HQ),0);
  const isAdmin = state.currentUser?.role === 'admin';
  const al = restockAlerts();
  return `<div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">總兌換筆數</div><div class="stat-value">${state.orders.length}</div></div>
      <div class="stat-card"><div class="stat-label">今日兌換</div><div class="stat-value">${todayOrders}</div></div>
      <div class="stat-card"><div class="stat-label">贈品種類</div><div class="stat-value">${state.gifts.length}</div></div>
      <div class="stat-card"><div class="stat-label">門市庫存</div><div class="stat-value">${totalStock}</div></div>
      <div class="stat-card"><div class="stat-label">總部庫存</div><div class="stat-value">${hqStock}</div></div>

function renderCount() {
  let list = sortedGifts(state.gifts);
  if(state.countZone==='untagged') list = list.filter(isUntagged);
  else if(state.countZone) list = list.filter(g=>inZone(g,state.countZone));
  const draft = state.countDraft;
  const filledIds = Object.keys(draft).filter(id=>draft[id]!==''&&draft[id]!=null&&state.gifts.some(g=>g.id===id));
  const filledSum = filledIds.reduce((a,id)=>a+(parseInt(draft[id])||0),0);
  const diffCell = (g)=>{
    const v=draft[g.id]; if(v===''||v==null) return '';
    const n=parseInt(v); if(isNaN(n)) return '<span class="warn">數字錯誤</span>';
    const dlt=n-sv(g,HQ);
    return dlt===0?'<span style="color:#999">相同</span>':`<span class="${dlt>0?'diff-pos':'diff-neg'}">${dlt>0?'+':''}${dlt}</span>`;
  };
  return `<div>
    <div class="section-header">
      <div class="section-title">總部盤點</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-sm" data-action="downloadCountSheet">下載盤點表</button>
        <button class="btn btn-sm" data-action="togglePaste">${state.countPaste?'收起貼上':'從 Excel 貼上'}</button>
      </div>
    </div>
    <div class="hint" style="margin-bottom:.75rem">盤點完的數字填在「盤點數量」，填好的會先暫存在這台電腦，全部確認後按「寫入總部庫存」一次更新。沒填的贈品不會被更動。</div>
    ${state.countPaste?`<div class="panel">
      <div class="panel-title">從 Excel 貼上</div>
      <div class="hint" style="margin-bottom:8px">用「下載盤點表」的檔案填好數量後，整份選起來複製貼在下面（第一欄品名、第二欄數量，第三欄編號請保留不要改）。</div>
      <textarea class="form-input" id="count-paste" placeholder="品名　數量　編號"></textarea>
      <div style="margin-top:8px;text-align:right"><button class="btn btn-primary btn-sm" data-action="applyPaste">填入下方表格</button></div>
    </div>`:''}
    <div class="filter-bar">
      <select class="filter-select" id="cz">
        <option value="">全部專區</option>
        ${ZONES.map(z=>`<option value="${z.id}"${state.countZone===z.id?' selected':''}>${z.label}</option>`).join('')}
        <option value="untagged"${state.countZone==='untagged'?' selected':''}>未分類</option>
      </select>
      <input class="filter-select" id="count-search" placeholder="搜尋贈品名稱" style="min-width:180px">
      <span style="font-size:13px;color:#2c2c2a;align-self:center">已填 <b>${filledIds.length}</b> 項，合計 <b>${filledSum}</b> 件</span>
      <button class="btn btn-sm" data-action="clearCount" style="margin-left:auto">清除已填</button>
      <button class="btn btn-primary btn-sm" data-action="doCount" id="count-btn">寫入總部庫存</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>圖片</th><th>贈品</th><th>目前總部</th><th>盤點數量</th><th>差異</th><th>門市合計</th><th>上次盤點</th></tr></thead>
        <tbody>
          ${list.map(g=>{const url=imgUrl((g.image||'').split(',')[0].trim());const v=draft[g.id];return `<tr class="count-row" data-name="${esc((g.name||'').toLowerCase())}">

            <td><input class="count-input${v!==''&&v!=null?' filled':''}" data-gid="${g.id}" type="number" min="0" inputmode="numeric" value="${esc(v??'')}"></td>
            <td id="cd-${g.id}">${diffCell(g)}</td>
            <td>${storeSum(g)}</td>
            <td style="color:#999">${esc(g.hqCountedAt||'—')}</td>
          </tr>`;}).join('')}
          ${list.length===0?'<tr class="empty-row"><td colspan="7">沒有符合的贈品</td></tr>':''}
        </tbody>
      </table>

  </div>`;

function updateDistPreview(){
  const g = state.gifts.find(x=>x.id===state.dist.gid); if(!g) return;
  const total = STORES.reduce((a,s)=>a+(parseInt(state.dist.qty[s])||0),0);
  const after = sv(g,HQ) - total;
  const t = document.getElementById('dist-total'), a = document.getElementById('dist-after');
  if(t) t.textContent = total;
  if(a){ a.textContent = after; a.className = after<0?'warn':''; }
}

async function doDistribute(){
  const d = state.dist;
  const g = state.gifts.find(x=>x.id===d.gid);
  if(!g){ alert('請先選擇贈品'); return; }
  const raw = STORES.map(s=>({store:s, v:(d.qty[s]??'').toString().trim()})).filter(x=>x.v!=='');
  if(raw.some(x=>!/^\d+$/.test(x.v))){ alert('數量只能填 0 以上的整數'); return; }
  const items = raw.map(x=>({store:x.store, qty:parseInt(x.v)})).filter(x=>x.qty>0);
  if(!items.length){ alert('請至少填一家門市的配發數量'); return; }
  const total = items.reduce((a,x)=>a+x.qty,0);
  if(total > sv(g,HQ)){ alert(`總部只有 ${sv(g,HQ)} 件，不夠配發 ${total} 件`); return; }
  if(!confirm(`確定從總部配發「${g.name}」共 ${total} 件？\n\n`+items.map(x=>`${x.store}店　${x.qty} 件`).join('\n'))) return;
  const btn = document.getElementById('dist-btn'); if(btn){ btn.disabled=true; btn.textContent='處理中...'; }
  try{
    const note = (d.note||'').trim();
    await runTransaction(db, async tx => {
      const ref = doc(db,'gifts',g.id);
      const snap = await tx.get(ref);
      if(!snap.exists()) throw new Error('找不到這個贈品，可能已被刪除');
      const data = snap.data(); const st = data.stock||{};
      const hq = st[HQ]||0;
      if(hq < total) throw new Error(`總部庫存剛剛變成 ${hq} 件，不夠配發 ${total} 件`);
      const upd = {['stock.'+HQ]: hq-total};
      items.forEach(x=>{ upd['stock.'+x.store] = (st[x.store]||0) + x.qty; });
      tx.update(ref, upd);
      const date = localDate(), ts = new Date().toISOString(), op = opName(), giftName = data.name||g.name;
      const batchId = ts+'-'+Math.random().toString(36).slice(2,7);
      items.forEach(x=>{
        tx.set(doc(collection(db,'distributions')), {date,timestamp:ts,giftId:g.id,giftName,store:x.store,quantity:x.qty,operator:op,note,batchId,cancelled:false});
        tx.set(doc(collection(db,'inventoryHistory')), {date,timestamp:ts,store:x.store,giftName,change:x.qty,reason:'總部配發',operator:op});
      });
      tx.set(doc(collection(db,'inventoryHistory')), {date,timestamp:ts,store:HQ,giftName,change:-total,reason:'配發出庫',operator:op});
    });
    state.dist = {gid:g.id, qty:{}, note:''};
    render();
    alert(`配發完成：${g.name} 共 ${total} 件`);
  }catch(err){
    alert(errMsg(err));
    if(btn){ btn.disabled=false; btn.textContent='確認配發'; }
  }
}

async function cancelDist(id){
  const r = state.distributions.find(x=>x.id===id); if(!r || r.cancelled) return;
  if(!confirm(`確定撤銷這筆配發？\n\n${r.giftName}　${r.store}店 ${r.quantity} 件\n會從${r.store}店扣回，加回總部`)) return;
  try{
    await runTransaction(db, async tx => {
      const dref = doc(db,'distributions',id);
      const dsnap = await tx.get(dref);
      if(!dsnap.exists() || dsnap.data().cancelled) throw new Error('這筆配發已經撤銷過了');
      const gref = doc(db,'gifts',r.giftId);
      const gsnap = await tx.get(gref);
      if(!gsnap.exists()) throw new Error('這個贈品已被刪除，無法撤銷，請改用「庫存紀錄 → 調整庫存」');
      const st = gsnap.data().stock||{}; const cur = st[r.store]||0;
      if(cur < r.quantity) throw new Error(`${r.store}店目前只剩 ${cur} 件（可能已經兌換出去），無法整筆退回，請改用「庫存紀錄 → 調整庫存」`);
      tx.update(gref, {['stock.'+r.store]: cur-r.quantity, ['stock.'+HQ]: (st[HQ]||0)+r.quantity});
      const date = localDate(), ts = new Date().toISOString(), op = opName();
      tx.update(dref, {cancelled:true, cancelledBy:op, cancelledAt:ts});
      tx.set(doc(collection(db,'inventoryHistory')), {date,timestamp:ts,store:r.store,giftName:r.giftName,change:-r.quantity,reason:'撤銷配發',operator:op});
      tx.set(doc(collection(db,'inventoryHistory')), {date,timestamp:ts,store:HQ,giftName:r.giftName,change:r.quantity,reason:'撤銷配發',operator:op});
    });
  }catch(err){ alert(errMsg(err)); }
}

function applyPaste(){
  const txt = document.getElementById('count-paste')?.value || '';
  const norm = t => (t||'').replace(/\s+/g,'').toLowerCase();
  const byName = {};
  state.gifts.forEach(g=>{ const k=norm(g.name); (byName[k]=byName[k]||[]).push(g); });
  let ok=0; const notFound=[], dup=[], bad=[];
  txt.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    const cols = line.split('\t').length>1 ? line.split('\t') : line.split(',');
    const name = (cols[0]||'').trim().replace(/^"|"$/g,'');
    const qv = (cols[1]||'').trim().replace(/^"|"$/g,'');
    const id = (cols[2]||'').trim().replace(/^"|"$/g,'');
    if(!name || name==='品名') return;
    if(qv==='') return;
    if(!/^\d+$/.test(qv)){ bad.push(name); return; }
    let g = id && state.gifts.find(x=>x.id===id);
    if(!g){
      const m = byName[norm(name)]||[];
      if(m.length===1) g=m[0];
      else if(m.length>1){ dup.push(name); return; }
      else { notFound.push(name); return; }
    }
    state.countDraft[g.id] = qv; ok++;
  });
  saveDraft();
  state.countPaste = false; render();
  let msg = `已填入 ${ok} 項`;
  if(notFound.length) msg += `\n\n找不到這些品名（請手動填）：\n`+notFound.join('\n');
  if(dup.length) msg += `\n\n有同名贈品無法判斷（請手動填）：\n`+dup.join('\n');
  if(bad.length) msg += `\n\n數量不是整數：\n`+bad.join('\n');
  alert(msg);
}

async function doCount(){
  const entries = Object.entries(state.countDraft).filter(([id,v])=>v!==''&&v!=null);
  const items = [];
  for(const [id,v] of entries){
    const g = state.gifts.find(x=>x.id===id); if(!g) continue;
    if(!/^\d+$/.test(String(v).trim())){ alert(`「${g.name}」的數量不是 0 以上的整數，請修正`); return; }
    items.push({g, n:parseInt(v), old:sv(g,HQ)});
  }
  if(!items.length){ alert('還沒有填任何盤點數量'); return; }
  const changed = items.filter(x=>x.n!==x.old);
  const sum = items.reduce((a,x)=>a+x.n,0);
  if(!confirm(`確定寫入總部庫存？\n\n共 ${items.length} 項，總部合計 ${sum} 件\n其中 ${changed.length} 項數字有變動\n\n沒填的贈品不會更動`)) return;
  const btn = document.getElementById('count-btn'); if(btn){ btn.disabled=true; btn.textContent='寫入中...'; }
  try{
    const date = localDate(), ts = new Date().toISOString(), op = opName();
    for(let i=0;i<items.length;i+=200){
      const batch = writeBatch(db);
      items.slice(i,i+200).forEach(x=>{
        batch.update(doc(db,'gifts',x.g.id), {['stock.'+HQ]: x.n, hqCountedAt: date});
        if(x.n!==x.old) batch.set(doc(collection(db,'inventoryHistory')), {date,timestamp:ts,store:HQ,giftName:x.g.name,change:x.n-x.old,reason:'總部盤點',operator:op});
      });
      await batch.commit();
    }
    state.countDraft = {}; saveDraft();
    render();
    alert(`已寫入 ${items.length} 項總部庫存`);
  }catch(err){
    alert(errMsg(err));
    if(btn){ btn.disabled=false; btn.textContent='寫入總部庫存'; }
  }
}

async function handleAction(e) {
  const action = e.currentTarget.dataset.action;
  if(action==='doLogin') {
    const u=document.getElementById('lu').value.trim();
    const p=document.getElementById('lp').value;
    const user=state.users.find(x=>x.username===u&&x.password===p);
    if(user){state.loggedIn=true;state.currentUser=user;state.tab='dashboard';render();}
    else{document.getElementById('lerr').textContent='帳號或密碼錯誤';}
  }
  else if(action==='logout'){state.loggedIn=false;state.currentUser=null;render();}
  else if(action==='tab'){state.tab=e.currentTarget.dataset.tab;render();}
  else if(action==='openAddGift'){state.modal='addGift';state.editingGift=null;render();}
  else if(action==='editGift'){
    const g=state.gifts.find(x=>x.id===e.currentTarget.dataset.gid);
    state.editingGift=JSON.parse(JSON.stringify(g));
    state.modal='editGift';render();
  }
  else if(action==='deleteGift'){
    if(confirm('確定要刪除此贈品？')){
      await deleteDoc(doc(db,'gifts',e.currentTarget.dataset.gid));
    }
  }
  else if(action==='toggleZone'){
    const g=state.gifts.find(x=>x.id===e.currentTarget.dataset.gid); if(!g) return;
    const z=e.currentTarget.dataset.zone;
    let zones=[...giftZones(g)];
    zones = zones.includes(z) ? zones.filter(x=>x!==z) : [...zones,z];
    await updateDoc(doc(db,'gifts',g.id),{zones, zone: zones.includes(ZONE_PRE)?ZONE_PRE:'general'});
  }
  else if(action==='deleteOrder'){
    if(confirm('確定要刪除這筆兌換紀錄？刪除後無法復原，庫存不會自動加回。')){
      await deleteDoc(doc(db,'orders',e.currentTarget.dataset.oid));
    }
  }
  else if(action==='saveGift'){
    const name=document.getElementById('m-name').value.trim();
    const pts=parseInt(document.getElementById('m-pts').value)||0;
    const val=parseInt(document.getElementById('m-val').value)||0;
    const stock={};
    ALL_LOCS.forEach(s=>{const el=document.getElementById('m-s-'+s); if(el && !el.disabled) stock[s]=parseInt(el.value)||0;});
    const alS=parseInt(document.getElementById('m-al-s').value), alH=parseInt(document.getElementById('m-al-h').value);
    const alertStore=Number.isFinite(alS)&&alS>=0?alS:ALERT_STORE_DEFAULT, alertHq=Number.isFinite(alH)&&alH>=0?alH:ALERT_HQ_DEFAULT;
    const noRestock=!!document.getElementById('m-norestock')?.checked;
    if(!name){alert('請填寫贈品名稱');return;}
    const image = document.getElementById('m-img-url')?.value.trim() || state.editingGift?.image || '';
    const zones = [...document.querySelectorAll('.m-zone:checked')].map(c=>c.value);
    const zone = zones.includes(ZONE_PRE)?ZONE_PRE:'general';
    if(state.modal==='editGift'){
      // 只寫入有改動的庫存欄位，避免蓋掉編輯期間門市剛兌換扣掉的數字
      const orig=state.editingGift.stock||{};
      const upd={name,points:pts,value:val,image,zones,zone,alertStore,alertHq,noRestock};
      Object.keys(stock).forEach(s=>{ if(stock[s]!==(orig[s]||0)) upd['stock.'+s]=stock[s]; });
      await updateDoc(doc(db,'gifts',state.editingGift.id),upd);
    } else {
      if(!stock[HQ]) delete stock[HQ];
      await addDoc(collection(db,'gifts'),{name,points:pts,value:val,stock,image,zones,zone,alertStore,alertHq,noRestock});
    }
    state.modal=null;state.editingGift=null;render();
  }
  else if(action==='giftPagePrev'){state.giftPage=Math.max(1,state.giftPage-1);render();}
  else if(action==='giftPageNext'){state.giftPage++;render();}
  else if(action==='closeModal'){state.modal=null;state.editingGift=null;render();}
  else if(action==='openAdjust'){state.modal='adjust';render();}
  else if(action==='saveAdjust'){
    const store=document.getElementById('adj-store').value;
    const gid=document.getElementById('adj-gift').value;
    const qty=parseInt(document.getElementById('adj-qty').value)||0;
    const reason=document.getElementById('adj-reason').value;
    const g=state.gifts.find(x=>x.id===gid);
    if(g && qty!==0){
      try{
        await runTransaction(db, async tx=>{
          const ref=doc(db,'gifts',gid); const snap=await tx.get(ref);
          if(!snap.exists()) throw new Error('找不到這個贈品');
          const cur=(snap.data().stock||{})[store]||0;
          const nv=Math.max(0,cur+qty);
          tx.update(ref,{['stock.'+store]:nv});
          tx.set(doc(collection(db,'inventoryHistory')),{
            date:localDate(),timestamp:new Date().toISOString(),
            store,giftName:g.name,change:nv-cur,reason,
            operator:opName()
          });
        });
      }catch(err){ alert(errMsg(err)); return; }
    }
    state.modal=null;render();
  }
  else if(action==='clearFilter'){state.filterStore='';state.filterDate='';state.filterZone='';render();}
  else if(action==='pickDistGift'){ state.dist={gid:e.currentTarget.dataset.gid,qty:{},note:''}; render(); document.getElementById('dist-gift')?.scrollIntoView({behavior:'smooth',block:'center'}); }
  else if(action==='doDistribute'){ await doDistribute(); }
  else if(action==='cancelDist'){ await cancelDist(e.currentTarget.dataset.did); }
  else if(action==='clearDistFilter'){ state.distFilterStore=''; state.distFilterDate=''; render(); }
  else if(action==='downloadCountSheet'){ downloadCountSheet(); }
  else if(action==='togglePaste'){ state.countPaste=!state.countPaste; render(); }
  else if(action==='applyPaste'){ applyPaste(); }
  else if(action==='clearCount'){ if(confirm('確定清除所有已填的盤點數量？')){ state.countDraft={}; saveDraft(); render(); } }
  else if(action==='doCount'){ await doCount(); }
  else if(action==='openAddUser'){state.modal='addUser';render();}
  else if(action==='saveUser'){
    const un=document.getElementById('u-un').value.trim();
    const pw=document.getElementById('u-pw').value;
    const nm=document.getElementById('u-nm').value.trim();
    const role=document.getElementById('u-role').value;
    const store=document.getElementById('u-store').value;
    if(!un||!pw||!nm){alert('請填寫所有欄位');return;}
    state.users.push({username:un,password:pw,role,name:nm,store});
    state.modal=null;render();
  }
  else if(action==='deleteUser'){
    const idx=parseInt(e.currentTarget.dataset.uid);
    if(confirm('確定刪除此帳號？')){state.users.splice(idx,1);render();}
  }
}
</script>
</body>
</html>
